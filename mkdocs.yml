site_name: "Pulse Docs -- Plataforma PFM Core Banking"
site_description: "Portal Institucional de Negocio, Produto, Design System UX/UI, Arquitetura C4/ADRs e Operacoes SRE/FinOps"
site_url: https://sorobanerp.github.io/pfm-docs/
repo_name: Sorobanerp/pfm-docs
repo_url: https://github.com/Sorobanerp/pfm-docs

theme:
  name: material
  language: pt-BR
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro (#111711)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro (#F7F9F5)

extra_css:
  - stylesheets/pulse-material.css

plugins:
  - search:
      lang:
        - pt
        - en

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Inicio: index.md
  - 1. Visao de Negocio:
      - Proposta de Valor, Mercado & Planos SaaS (BRL): 01-visao-negocio/proposta-valor-e-mercado.md
  - 2. Visao de Produto:
      - PRD Core Banking (RN01-RN06 & Taxonomia): 02-visao-produto/prd-core-banking.md
      - Casos de Uso (UC-01 a UC-08): 02-visao-produto/casos-de-uso.md
      - Backlog Scrum & Especificacao BDD (BRL): 02-visao-produto/backlog-e-bdd.md
  - 3. Visao do Usuario (UX/UI):
      - IDS Design System "PFM Pulse" (Web & Android): 03-visao-usuario/ids-design-system.md
  - 4. Visao de Arquitetura:
      - Arquitetura C4 & Catalogo dos 15 Repositorios: 04-visao-arquitetura/arquitetura-c4-e-repos.md
      - Fluxos de Sequencia (PDF RAM, IA, NFC-e, SAC): 04-visao-arquitetura/fluxos-de-sequencia.md
      - Seguranca Criptografica, RLS & LGPD: 04-visao-arquitetura/seguranca-e-lgpd.md
      - Decisoes Arquiteturais (ADR-001 a ADR-010): 04-visao-arquitetura/decisoes-arquiteturais-adrs.md
  - 5. Visao de Tecnologia & Operacoes:
      - Desenvolvimento Local, IDEs, Swagger & gRPC: 05-visao-operacoes/desenvolvimento-local-e-ides.md
      - Gitflow Atlassian, CI/CD OpenTofu & OTel: 05-visao-operacoes/gitflow-cicd-e-qualidade.md
      - FinOps & Custos Cloud (USD + Estimativa BRL): 05-visao-operacoes/finops-e-custos-cloud.md
